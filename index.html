:root{

}

body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}

h1{font-size:22px} h2{font-size:16px} h3{font-size:14px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}

.grow{flex:1;min-width:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card.flat{background:transparent;border-style:dashed}

.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)}

.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border-radius:11px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:14px}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{border-color:transparent;background:var(--surface-2)}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px;border-radius:9px}
.btn.block{width:100%}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.hero-k{font-family:var(--display);font-weight:700;font-size:38px;line-height:1;letter-spacing:-0.02em}
.bar{height:8px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:5px;transition:width .3s}
.macro{display:grid;grid-template-columns:64px minmax(0,1fr) 92px;align-items:center;gap:10px;font-size:13px}
.macro b{font-weight:500}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:none}

.wd.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.wd.done{background:var(--good-soft);border-color:transparent;color:var(--good)}
.ex{border-top:1px solid var(--line);padding:12px 0}

.sets{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

.set.done{border:1.5px solid var(--good);background:var(--good-soft);color:var(--good)}

.tabs-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 0;border-radius:10px}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--accent);font-weight:500}
.timer{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom,0px));z-index:19;padding:0 max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.timer-in{max-width:520px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px}

.timer-in.end{background:var(--good);color:#fff}

.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-2);border-radius:11px;padding:3px;gap:3px}
.seg button{min-height:34px;border-radius:9px;font-size:13px;color:var(--muted)}

.food-opt{width:100%;text-align:left;display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:1px solid var(--line)}

.mac{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.mac i{font-style:normal} .mac .p{color:var(--prot)} .mac .f{color:var(--fat)} .mac .c{color:var(--carb)}
.chart{width:100%;overflow-x:auto}

.empty{padding:16px;text-align:center;color:var(--muted);font-size:13px;border:1px dashed var(--line);border-radius:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(132px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:12px;font-size:13px;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>

 core:{name:'Пресс и мобильность',short:'Пресс',min:25,ex:[

 rest:{name:'Отдых и восстановление',short:'Отдых',min:40,ex:[

};
const WEEK=[['rest','Вс'],['upA','Пн'],['low','Вт'],['upB','Ср'],['core','Чт'],['upA','Пт'],['low','Сб']];
const UNIT={r:'',s:'с',m:'мин'};

/* ---------- Состояние ---------- */
const LS='plan-na-massu-v1';
function defaults(){return{settings:{kcal:2850,p:120,f:80,c:410,weight:60,height:182,age:29},foods:[],weights:{},days:{}}}
let S=defaults();
try{const raw=localStorage.getItem(LS);if(raw){const o=JSON.parse(raw);S={...S,...o,settings:{...S.settings,...(o.settings||{})}}}}catch(e){}
let UI={tab:'today',foodDate:null,woSession:null,selSet:null,sheet:null,menu:'m1'};
try{const u=JSON.parse(localStorage.getItem(LS+'-ui')||'{}');if(u.tab)UI.tab=u.tab;if(u.menu)UI.menu=u.menu}catch(e){}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S));localStorage.setItem(LS+'-ui',JSON.stringify({tab:UI.tab,menu:UI.menu}))}catch(e){}}

/* ---------- Сохранение: только на этом устройстве ---------- */
function markDirty(){saveLocal()}
function hasContent(d){return d&&((d.food&&d.food.length)||(d.wo&&Object.keys(d.wo).length))}

/* ---------- Даты ---------- */
const pad=n=>String(n).padStart(2,'0');
const keyOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>keyOf(new Date());
const parse=k=>{const[a,b,c]=k.split('-').map(Number);return new Date(a,b-1,c)};
const addDays=(k,n)=>{const d=parse(k);d.setDate(d.getDate()+n);return keyOf(d)};
const MON=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MONs=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const WDN=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const fmtLong=k=>{const d=parse(k);return WDN[d.getDay()]+', '+d.getDate()+' '+MON[d.getMonth()]};
const fmtShort=k=>{const d=parse(k);return d.getDate()+' '+MONs[d.getMonth()]};

/* ---------- Помощники ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r0=n=>Math.round(n||0), r1=n=>Math.round((n||0)*10)/10;
const nf=n=>r0(n).toLocaleString('ru-RU');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const allFoods=()=>[...S.foods,...FOODS];
const foodById=id=>allFoods().find(f=>f.id===id);
function day(k){if(!S.days[k])S.days[k]={food:[],wo:{}};const d=S.days[k];d.food=d.food||[];d.wo=d.wo||{};return d}
const peekDay=k=>S.days[k]||{food:[],wo:{}};
function entryFrom(f,amount,meal){
  // amount: граммы, или количество порций для еды «на порцию»
  const m=f.per==='pc'?amount:amount/100;
  return{id:uid(),fid:f.id,n:f.n,g:f.per==='pc'?null:r0(amount),q:f.per==='pc'?amount:null,ql:f.pcl||'порц.',k:r0(f.k*m),p:r1(f.p*m),f:r1(f.f*m),c:r1(f.c*m),meal}
}
function totals(list){return list.reduce((t,e)=>({k:t.k+(e.k||0),p:t.p+(e.p||0),f:t.f+(e.f||0),c:t.c+(e.c||0)}),{k:0,p:0,f:0,c:0})}
function itemsTotals(items){return totals(items.map(([id,g])=>entryFrom(foodById(id),g,'x')))}
const macTxt=t=>`<span class="mac"><i class="p">Б ${r0(t.p)}</i> · <i class="f">Ж ${r0(t.f)}</i> · <i class="c">У ${r0(t.c)}</i></span>`;
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,1800)}
const sessionIdFor=k=>WEEK[parse(k).getDay()][0];
const setLabel=(v,u)=>v==null?'':v+(UNIT[u]?' '+UNIT[u]:'');

/* ---------- Тренировки: логика ---------- */
function sessionProgress(k,sid){
  const s=SESSIONS[sid],d=peekDay(k);let done=0,total=0;
  s.ex.forEach(e=>{total+=e.sets;const w=(d.wo||{})[e.id]||{};for(let i=0;i<e.sets;i++)if(w[i]!=null)done++});
  return{done,total};
}
function trained(k){const d=S.days[k];return !!(d&&d.woDone)}
function lastResult(exId,before){
  const keys=Object.keys(S.days).filter(k=>k<before).sort().reverse();
  for(const k of keys){const w=(S.days[k].wo||{})[exId];if(w&&Object.keys(w).length)return{k,vals:Object.keys(w).sort().map(i=>w[i])}}
  return null;
}
function streak(){
  let k=today(),n=0;if(!trained(k))k=addDays(k,-1);
  while(trained(k)){n++;k=addDays(k,-1)}return n;
}
function advice(e,last){
  if(!last)return 'Первый раз: подбери резинку так, чтобы последние 2 повтора давались тяжело.';
  const ok=last.vals.length>=e.sets&&last.vals.every(v=>v>=e.reps);
  const lv=last.vals.map(v=>setLabel(v,e.unit)).join(' · ');
  if(ok)return `Прошлый раз (${fmtShort(last.k)}): ${lv}. План выполнен — сегодня +1 ${e.unit==='r'?'повтор':'5 секунд'} в каждом подходе${e.unit==='r'&&e.id!=='pushup'&&e.id!=='closepush'&&e.id!=='crunch'?' или резинка потуже':''}.`;
  return `Прошлый раз (${fmtShort(last.k)}): ${lv}. Цель сегодня — добить ${e.sets} × ${setLabel(e.reps,e.unit)}.`;
}

/* ---------- Таймер отдыха ---------- */
let T=null,tInt=null,actx=null;
function startTimer(sec){if(!sec)return;T={end:Date.now()+sec*1000,total:sec,fired:false};runTimer()}
function runTimer(){clearInterval(tInt);tInt=setInterval(tick,250);tick()}
function tick(){
  const el=$('#timer');if(!T){el.hidden=true;clearInterval(tInt);return}
  const left=Math.max(0,Math.ceil((T.end-Date.now())/1000));
  if(left===0&&!T.fired){T.fired=true;try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}beep()}
  el.hidden=false;
  el.innerHTML=`<div class="timer-in ${left===0?'end':''}"><div class="grow"><div class="tiny" style="opacity:.75">${left===0?'Отдых окончен':'Отдых'}</div><div class="t num">${Math.floor(left/60)}:${pad(left%60)}</div></div>
  <button class="btn sm" data-act="tplus">+15 с</button><button class="btn sm" data-act="tstop">${left===0?'Готово':'Стоп'}</button></div>`;
  if(left===0&&Date.now()-T.end>8000){T=null}
}
function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.15,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+.5);o.start();o.stop(actx.currentTime+.5)}catch(e){}}

 today:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>',

};
const TABS=[['today','Сегодня'],['workout','Тренировка'],['food','Питание'],['progress','Прогресс']];

/* ---------- Рендер ---------- */
function render(){
  $('#tabs').innerHTML=TABS.map(([id,l])=>`<button class="tab ${UI.tab===id?'on':''}" data-act="tab" data-v="${id}" aria-current="${UI.tab===id?'page':'false'}">${IC[id]}<span>${l}</span></button>`).join('');
  const v={today:vToday,workout:vWorkout,food:vFood,progress:vProgress}[UI.tab]();
  $('#view').innerHTML=v;renderSync();

function syncPill(){return navigator.onLine===false?'<span class="pill"><span class="dot"></span>Офлайн</span>':''}
function renderSync(){const el=$('#syncpill');if(el)el.innerHTML=syncPill()}
function topbar(eyebrow,title){return`<div class="top"><div class="grow"><div class="eyebrow">${eyebrow}</div><h1>${title}</h1></div><div id="syncpill">${syncPill()}</div></div>`}

function macroBlock(t){
  const st=S.settings;const rows=[['Белки','p',t.p,st.p,'var(--prot)'],['Жиры','f',t.f,st.f,'var(--fat)'],['Углеводы','c',t.c,st.c,'var(--carb)']];
  return rows.map(([l,_k,v,goal,col])=>`<div class="macro"><span>${l}</span><div class="bar"><i style="width:${Math.min(100,v/goal*100)}%;background:${col}"></i></div><span class="num muted" style="text-align:right"><b style="color:var(--ink)">${r0(v)}</b> / ${goal} г</span></div>`).join('');
}
function kcalState(eaten,goal){const r=eaten/goal;if(r>=.92&&r<=1.12)return['good','В норме'];if(r>1.12)return['warn','Перебор'];return['','Добирай']}

function vToday(){
  const k=today(),d=peekDay(k),t=totals(d.food),st=S.settings;
  const sid=sessionIdFor(k),s=SESSIONS[sid],pr=sessionProgress(k,sid);
  const left=st.kcal-t.k,leftP=st.p-t.p;const[ks,kl]=kcalState(t.k,st.kcal);
  const wkeys=Object.keys(S.weights).sort();const lastW=wkeys.length?S.weights[wkeys[wkeys.length-1]]:null;const firstW=wkeys.length?S.weights[wkeys[0]]:null;
  const hourHint=new Date().getHours()>=17;
  let fill='';
  if(left>150){
    const picks=FILLERS.map(x=>{const e=entryFrom(foodById(x.fid),x.g,'snack2');return{...x,e}})
      .filter(x=>x.e.k<=left+200).sort((a,b)=>leftP>15?(b.e.p-a.e.p):(b.e.k-a.e.k)).slice(0,4);
    fill=`<div class="card stack"><div class="row between"><h2>Что добрать</h2><span class="pill ${hourHint?'warn':''}">${nf(left)} ккал${leftP>0?' · '+r0(leftP)+' г белка':''}</span></div>
    <div class="chips">${picks.map(x=>`<button class="chip" data-act="fill" data-fid="${x.fid}" data-g="${x.g}">+ ${esc(x.n)} <span class="muted num">${x.e.k}</span></button>`).join('')}</div>
    <div class="tiny muted">Нажми, чтобы сразу записать в «Перекус 2».</div></div>`;
  }
  const done=trained(k)||pr.done===pr.total;
  return topbar(fmtLong(k),'План на массу')+`<div class="stack">
  <div class="card stack">
    <div class="row between" style="align-items:flex-end"><div><div class="eyebrow">Съедено</div><div class="hero-k num">${nf(t.k)}</div><div class="small muted num">из ${nf(st.kcal)} ккал</div></div><span class="pill ${ks}">${kl}</span></div>
    <div class="bar" style="height:10px"><i style="width:${Math.min(100,t.k/st.kcal*100)}%;background:var(--accent)"></i></div>
    ${macroBlock(t)}
    <button class="btn block" data-act="tab" data-v="food">Записать еду</button>
  </div>
  ${fill}
  <div class="card stack">
    <div class="row between"><div class="grow"><div class="eyebrow">Тренировка дня · ~${s.min} мин</div><h2>${s.name}</h2></div>${done?'<span class="pill good">Готово</span>':`<span class="pill acc num">${pr.done}/${pr.total}</span>`}</div>
    <div class="bar"><i style="width:${pr.total?pr.done/pr.total*100:0}%;background:var(--good)"></i></div>
    <button class="btn ${done?'':'primary'} block" data-act="tab" data-v="workout">${pr.done?'Продолжить':'Начать'}</button>
  </div>
  <div class="grid2">
    <div class="card"><div class="eyebrow">Серия</div><div class="hero-k num" style="font-size:28px">${streak()}</div><div class="small muted">дней подряд с тренировкой</div></div>
    <div class="card"><div class="eyebrow">Вес</div><div class="hero-k num" style="font-size:28px">${lastW!=null?String(lastW).replace('.',','):'—'}</div><div class="small muted">${lastW!=null&&wkeys.length>1?((lastW-firstW>=0?'+':'')+r1(lastW-firstW)).replace('.',',')+' кг с начала':'кг'}</div></div>
  </div>
  <div class="card stack"><h2>Взвешивание</h2><div class="small muted">Раз в неделю, утром после туалета, до еды.</div>
    <div class="row"><input id="wIn" type="number" inputmode="decimal" step="0.1" min="30" max="200" placeholder="${lastW??60}" value="${S.weights[k]??''}" aria-label="Вес, кг"><button class="btn primary" data-act="weight">Записать</button></div></div>
  </div>`;
}

function vWorkout(){
  const k=today(),sid=UI.woSession||sessionIdFor(k),s=SESSIONS[sid],d=peekDay(k);
  const ws=parse(k);const mon=new Date(ws);mon.setDate(ws.getDate()-((ws.getDay()+6)%7));
  const week=[...Array(7)].map((_,i)=>{const dd=new Date(mon);dd.setDate(mon.getDate()+i);const kk=keyOf(dd);const id=WEEK[dd.getDay()][0];return`<div class="wd ${kk===k?'today':''} ${trained(kk)?'done':''}"><span>${WDN[dd.getDay()]}</span><b>${SESSIONS[id].short}</b></div>`}).join('');
  const pr=sessionProgress(k,sid);
  const ex=s.ex.map(e=>{
    const w=(d.wo||{})[e.id]||{};const last=lastResult(e.id,k);
    const sets=[...Array(e.sets)].map((_,i)=>{const v=w[i];const sel=UI.selSet&&UI.selSet.ex===e.id&&UI.selSet.i===i;
      return`<button class="set ${v!=null?'done':''} ${sel?'sel':''}" data-act="set" data-ex="${e.id}" data-i="${i}" aria-label="Подход ${i+1}">${v!=null?setLabel(v,e.unit):setLabel(e.reps,e.unit)}</button>`}).join('');
    let adj='';
    if(UI.selSet&&UI.selSet.ex===e.id&&w[UI.selSet.i]!=null){const step=e.unit==='s'?5:1;
      adj=`<div class="adj"><span class="grow">Подход ${UI.selSet.i+1}: сколько сделал</span><button class="btn sm" data-act="adj" data-d="${-step}" aria-label="Меньше">−</button><span class="v num">${setLabel(w[UI.selSet.i],e.unit)}</span><button class="btn sm" data-act="adj" data-d="${step}" aria-label="Больше">+</button><button class="btn sm ghost" data-act="unset">Сбросить</button></div>`}
    return`<div class="ex"><div class="row between"><h3 class="grow">${esc(e.n)}</h3><span class="small muted num">${e.sets} × ${setLabel(e.reps,e.unit)}</span></div>
    <div class="hint">${esc(e.hint)}</div>${e.unit==='m'?'':`<div class="tip">${esc(advice(e,last))}</div>`}
    <div class="sets">${sets}</div>${adj}</div>`}).join('');
  const others=Object.keys(SESSIONS).map(id=>`<button class="chip ${id===sid?'on':''}" data-act="sess" data-v="${id}">${SESSIONS[id].short}</button>`).join('');
  const done=trained(k);
  return topbar('Тренировка · '+fmtLong(k),esc(s.name))+`<div class="stack">
  <div class="week">${week}</div>
  <div class="row wrap"><span class="small muted">Другая тренировка:</span><div class="chips">${others}</div></div>
  <div class="card"><div class="row between" style="margin-bottom:8px"><span class="small muted">Нажми на подход, когда сделал. Повторное нажатие — поправить число.</span><span class="pill acc num">${pr.done}/${pr.total}</span></div>${ex}</div>
  ${done?'<div class="card row between"><span><b>Тренировка записана.</b> <span class="muted small">Отдыхай и добирай калории.</span></span><button class="btn sm" data-act="undone">Отменить</button></div>'
       :`<button class="btn primary block" data-act="finish">Завершить тренировку</button>`}
  <div class="small muted">Подход делай до состояния «ещё 1–2 повтора смог бы». Когда план выполнен во всех подходах, в следующий раз добавляй повтор или берёшь резинку потуже.</div>
  </div>`;
}

  const k=UI.foodDate||today(),d=peekDay(k),t=totals(d.food),st=S.settings;
  const isToday=k===today();
  const meals=SLOTS.map(([sl,l])=>{const items=d.food.filter(e=>e.meal===sl);const mt=totals(items);
    return`<div class="card"><div class="row between"><h2>${l}</h2><span class="small muted num">${items.length?nf(mt.k)+' ккал':''}</span></div>

    <button class="btn sm ghost" style="margin-top:8px" data-act="add" data-meal="${sl}">+ Добавить</button></div>`}).join('');
  const m=MENUS.find(x=>x.id===UI.menu)||MENUS[0];const mt=totals(m.meals.flatMap(ml=>ml.items.map(([id,g])=>entryFrom(foodById(id),g,'x'))));
  const menu=`<div class="card stack"><div class="row between wrap"><h2>Моё меню</h2><div class="chips">${MENUS.map(x=>`<button class="chip ${x.id===m.id?'on':''}" data-act="menu" data-v="${x.id}">${x.name}</button>`).join('')}</div></div>
   <div class="row between wrap"><span class="small muted">${esc(m.note)}</span><span class="small num"><b style="font-weight:500">${nf(mt.k)} ккал</b> · ${macTxt(mt)}</span></div>
   <div class="list">${m.meals.map((ml,i)=>{const tt=itemsTotals(ml.items);return`<div class="li"><div class="grow"><div class="eyebrow">${SLOTS.find(s=>s[0]===ml.slot)[1]}</div><div>${esc(ml.name)}</div><div class="mac">${ml.items.map(([id,g])=>esc(foodById(id).n.toLowerCase())+' '+g+' г').join(', ')}</div><div class="mac">${nf(tt.k)} ккал · ${macTxt(tt)}</div></div><button class="btn sm" data-act="addmeal" data-i="${i}" aria-label="Записать приём">+</button></div>`}).join('')}</div>
   <button class="btn block" data-act="addday">Записать весь день целиком</button></div>`;
  const myFoods=S.foods.length?`<div class="card stack"><h2>Моя еда</h2><div class="list">${S.foods.map(f=>`<div class="li"><div class="grow"><div>${esc(f.n)}</div><div class="mac">${f.per==='pc'?'на 1 '+esc(f.pcl||'порцию'):'на 100 г'}: ${f.k} ккал · <i class="p">Б ${r1(f.p)}</i> <i class="f">Ж ${r1(f.f)}</i> <i class="c">У ${r1(f.c)}</i></div></div><button class="x" data-act="delfood" data-id="${f.id}" aria-label="Удалить">${IC.x}</button></div>`).join('')}</div></div>`:'';
  return topbar('Питание',`<span style="display:inline-flex;align-items:center;gap:8px"><button class="btn sm ghost" data-act="fd" data-d="-1" aria-label="Предыдущий день">‹</button>${isToday?'Сегодня':fmtShort(k)}<button class="btn sm ghost" data-act="fd" data-d="1" aria-label="Следующий день" ${isToday?'disabled':''}>›</button></span>`)+`<div class="stack">
  <div class="card stack"><div class="row between"><span><span class="hero-k num" style="font-size:26px">${nf(t.k)}</span> <span class="muted num">/ ${nf(st.kcal)} ккал</span></span><span class="small muted">${fmtLong(k)}</span></div>${macroBlock(t)}
   <div class="row wrap"><button class="btn sm" data-act="copyprev">Как вчера</button><button class="btn sm" data-act="add" data-meal="${guessSlot()}">+ Своя еда или продукт</button></div></div>
  ${meals}
  ${menu}
  ${prepCard()}
  ${myFoods}
  </div>`;
}
function guessSlot(){const h=new Date().getHours();return h<11?'breakfast':h<13?'snack1':h<16?'lunch':h<19?'snack2':'dinner'}

function prepCard(){
  // заготовка на 3 дня: Масса-1, Масса-2, Масса-1; варёное → сухое/сырое
  const plan=[MENUS[0],MENUS[1],MENUS[0]];const sum={};
  plan.forEach(m=>m.meals.forEach(ml=>ml.items.forEach(([id,g])=>sum[id]=(sum[id]||0)+g)));
  const conv={buck:['Гречка сухая',1/2.7],pasta:['Макароны сухие',1/2.3],chick:['Куриная грудка сырая',1.35],pot:['Картофель сырой',1.05]};
  const rows=Object.entries(sum).map(([id,g])=>{const c=conv[id];const n=c?c[0]:foodById(id).n;const gg=c?g*c[1]:g;
    const f=foodById(id);const pcs=f.pc&&!c?` (~${Math.ceil(g/f.pc)} ${f.pcl})`:'';
    return[n,(gg>=1000?(r1(gg/1000)+'').replace('.',',')+' кг':(id==='milk'||id==='kefir'?r0(gg/10)*10+' мл':r0(gg/10)*10+' г'))+pcs]}).sort((a,b)=>a[0].localeCompare(b[0],'ru'));
  return`<div class="card stack"><h2>Заготовка на 3 дня</h2>
  <div class="small muted">Масса-1 → Масса-2 → Масса-1. Один раз варишь крупу, запекаешь курицу и делаешь соус с фаршем, раскладываешь по контейнерам. В холодильнике держится 3 дня.</div>
  <details><summary class="small" style="cursor:pointer;color:var(--accent)">Список покупок</summary><div class="list" style="margin-top:6px">${rows.map(([n,a])=>`<div class="li"><span class="grow">${esc(n)}</span><span class="num muted small">${a}</span></div>`).join('')}</div></details></div>`;
}

function vProgress(){
  const st=S.settings,k=today();
  const wk=Object.keys(S.weights).sort();
  let wChart='<div class="empty">Записывай вес раз в неделю — здесь появится график.</div>';
  if(wk.length>=2){
    const W=340,H=170,L=38,R=12,Tp=12,B=24;const vals=wk.map(x=>S.weights[x]);
    let mn=Math.floor(Math.min(...vals)-0.5),mx=Math.ceil(Math.max(...vals)+0.5);if(mx-mn<2)mx=mn+2;
    const t0=parse(wk[0]).getTime(),t1=parse(wk[wk.length-1]).getTime()||t0+1;
    const X=key=>L+(W-L-R)*((parse(key).getTime()-t0)/Math.max(1,t1-t0)),Y=v=>Tp+(H-Tp-B)*(1-(v-mn)/(mx-mn));
    const ticks=[mn,(mn+mx)/2,mx];
    const pts=wk.map(x=>`${r1(X(x))},${r1(Y(S.weights[x]))}`).join(' ');
    wChart=`<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="График веса">
    ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${String(r1(v)).replace('.',',')}</text>`).join('')}
    <polygon points="${L},${H-B} ${pts} ${r1(X(wk[wk.length-1]))},${H-B}" fill="var(--accent)" opacity=".1"/>
    <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/>
    ${wk.map((x,i)=>`<circle cx="${X(x)}" cy="${Y(S.weights[x])}" r="${i===wk.length-1?4.5:3}" fill="${i===wk.length-1?'var(--accent)':'var(--surface)'}" stroke="var(--accent)" stroke-width="2"/>`).join('')}
    <text x="${L}" y="${H-6}" font-size="11" fill="var(--muted)">${fmtShort(wk[0])}</text><text x="${W-R}" y="${H-6}" text-anchor="end" font-size="11" fill="var(--muted)">${fmtShort(wk[wk.length-1])}</text></svg></div>`;
  }
  const days=[...Array(14)].map((_,i)=>addDays(k,i-13));const kc=days.map(x=>totals(peekDay(x).food).k);
  const W2=340,H2=150,L2=8,R2=8,T2=14,B2=22;const max=Math.max(st.kcal*1.25,...kc);const bw=(W2-L2-R2)/14;
  const Y2=v=>T2+(H2-T2-B2)*(1-v/max);
  const bars=days.map((x,i)=>{const v=kc[i];const h=(H2-T2-B2)*v/max;const ok=v>=st.kcal*.92;return`<rect x="${r1(L2+i*bw+2)}" y="${r1(H2-B2-h)}" width="${r1(bw-4)}" height="${r1(h)}" rx="3" fill="${v===0?'var(--surface-2)':ok?'var(--good)':'var(--accent)'}" opacity="${v===0?1:.85}"/>${i%2===1||i===13?`<text x="${r1(L2+i*bw+bw/2)}" y="${H2-6}" text-anchor="middle" font-size="10" fill="var(--muted)">${parse(x).getDate()}</text>`:''}`}).join('');
  const kChart=`<div class="chart"><svg viewBox="0 0 ${W2} ${H2}" role="img" aria-label="Калории за 14 дней">${bars}
   <line x1="${L2}" x2="${W2-R2}" y1="${Y2(st.kcal)}" y2="${Y2(st.kcal)}" stroke="var(--ink)" stroke-dasharray="4 4" opacity=".55"/>
   <text x="${W2-R2}" y="${Y2(st.kcal)-5}" text-anchor="end" font-size="10.5" fill="var(--muted)">цель ${nf(st.kcal)}</text></svg></div>`;
  const hit=kc.filter(v=>v>=st.kcal*.92).length;
  const mon=parse(k);mon.setDate(mon.getDate()-((mon.getDay()+6)%7));let wkDone=0;for(let i=0;i<7;i++){const dd=new Date(mon);dd.setDate(mon.getDate()+i);if(trained(keyOf(dd)))wkDone++}
  return topbar('Прогресс','Как идёт масса')+`<div class="stack">
  <div class="grid2"><div class="card"><div class="eyebrow">Тренировок на неделе</div><div class="hero-k num" style="font-size:28px">${wkDone}<span class="muted" style="font-size:16px"> / 7</span></div></div>
  <div class="card"><div class="eyebrow">Дней в норме ккал</div><div class="hero-k num" style="font-size:28px">${hit}<span class="muted" style="font-size:16px"> / 14</span></div></div></div>
  <div class="card stack"><div class="row between"><h2>Вес</h2><span class="small muted">цель: +0,25–0,5 кг в неделю</span></div>${wChart}</div>
  <div class="card stack"><h2>Калории за 14 дней</h2>${kChart}<div class="tiny muted">Зелёный — день добран до нормы.</div></div>
  <div class="card stack"><h2>Мои нормы</h2>
   <div class="grid4"><label>Ккал<input id="sK" type="number" inputmode="numeric" value="${st.kcal}"></label><label>Белки, г<input id="sP" type="number" inputmode="numeric" value="${st.p}"></label><label>Жиры, г<input id="sF" type="number" inputmode="numeric" value="${st.f}"></label><label>Углев., г<input id="sC" type="number" inputmode="numeric" value="${st.c}"></label></div>
   <button class="btn" data-act="saveTargets">Сохранить нормы</button>
   <div class="grid4" style="grid-template-columns:repeat(3,minmax(0,1fr))"><label>Вес, кг<input id="sW" type="number" inputmode="decimal" step="0.1" value="${(wk.length?S.weights[wk[wk.length-1]]:st.weight)}"></label><label>Рост, см<input id="sH" type="number" inputmode="numeric" value="${st.height}"></label><label>Возраст<input id="sA" type="number" inputmode="numeric" value="${st.age}"></label></div>
   <button class="btn" data-act="recalc">Пересчитать под мой вес</button>
   <div class="tiny muted">Расчёт: обмен по Миффлину — Сан Жеору × 1,55 (ежедневные тренировки) + 350 ккал на рост. Белок 2 г, жиры 1,35 г на кг. Если вес не растёт 2 недели подряд — добавь 200 ккал.</div>
  </div>
  <div class="card stack"><h2>Резервная копия</h2>
   <div class="small muted">Все записи хранятся только на этом телефоне. Раз в неделю скачивай копию: если почистишь браузер или сменишь телефон, загрузишь её обратно.</div>
   <div class="row wrap"><button class="btn" data-act="export">Скачать копию</button><label class="btn" style="flex-direction:row;color:var(--ink);font-size:14px">Загрузить копию<input id="importFile" type="file" accept="application/json,.json" hidden></label></div>
  </div>
  </div>`;
}

      <div class="card row between" id="fcalc"><span class="hero-k num" style="font-size:24px">${e.k}<span class="muted" style="font-size:13px;font-family:var(--body)"> ккал</span></span>${macTxt(e)}</div>

    <div class="seg" style="grid-template-columns:1fr 1fr"><button class="${sh.per!=='pc'?'on':''}" data-act="cper" data-v="100">На 100 г</button><button class="${sh.per==='pc'?'on':''}" data-act="cper" data-v="pc">На 1 порцию</button></div>

    <div class="tiny muted">Цифры есть на упаковке. Если знаешь только ккал — БЖУ можно оставить пустыми.</div>
    <div id="cErr" class="small" style="color:var(--bad)" hidden></div>

    <div id="qErr" class="small" style="color:var(--bad)" hidden></div>

function foodListHtml(list,q){

const numIn=id=>{const v=parseFloat(String($(id)?.value||'').replace(',','.'));return isFinite(v)?v:NaN};

/* ---------- События ---------- */
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
  if(a==='sclose'&&b.classList.contains('sheet-bg')&&ev.target!==b)return; // клик внутри шторки
  const K=today();
  switch(a){
  case 'tab':UI.tab=b.dataset.v;UI.selSet=null;saveLocal();render();window.scrollTo(0,0);break;
  case 'weight':{const v=numIn('#wIn');if(!(v>=30&&v<=200)){toast('Введи вес в килограммах, например 60,4');return}S.weights[K]=r1(v);markDirty('profile');render();toast('Вес записан');break}
  case 'fill':{const f=foodById(b.dataset.fid);day(K).food.push(entryFrom(f,+b.dataset.g,'snack2'));markDirty(K);render();toast('Записано в «Перекус 2»');break}
  case 'sess':UI.woSession=b.dataset.v===sessionIdFor(K)?null:b.dataset.v;UI.selSet=null;render();break;
  case 'set':{const sid=UI.woSession||sessionIdFor(K);const e=SESSIONS[sid].ex.find(x=>x.id===b.dataset.ex);const i=+b.dataset.i;const d=day(K);const w=d.wo[e.id]=d.wo[e.id]||{};
    if(w[i]==null){const last=lastResult(e.id,K);const prev=i>0&&w[i-1]!=null?w[i-1]:(last&&last.vals[i]!=null?Math.max(last.vals[i],e.reps):e.reps);w[i]=prev;UI.selSet={ex:e.id,i};startTimer(e.rest);
      const pr=sessionProgress(K,sid);if(pr.done===pr.total){d.woDone=sid;toast('Тренировка выполнена')}}
    else UI.selSet=(UI.selSet&&UI.selSet.ex===e.id&&UI.selSet.i===i)?null:{ex:e.id,i};
    markDirty(K);render();break}
  case 'adj':{const d=day(K),s=UI.selSet;if(!s)return;const w=d.wo[s.ex];w[s.i]=Math.max(0,(w[s.i]||0)+(+b.dataset.d));markDirty(K);render();break}
  case 'unset':{const d=day(K),s=UI.selSet;if(!s)return;delete d.wo[s.ex][s.i];if(!Object.keys(d.wo[s.ex]).length)delete d.wo[s.ex];UI.selSet=null;markDirty(K);render();break}
  case 'finish':{const d=day(K);d.woDone=UI.woSession||sessionIdFor(K);markDirty(K);render();toast('Тренировка записана');break}
  case 'undone':{const d=day(K);delete d.woDone;markDirty(K);render();break}
  case 'tplus':if(T){T.end=Math.max(T.end,Date.now())+15000;T.fired=false;tick()}break;
  case 'tstop':T=null;tick();break;
  case 'fd':{const cur=UI.foodDate||K;const nx=addDays(cur,+b.dataset.d);if(nx>K)return;UI.foodDate=nx===K?null:nx;render();break}
  case 'add':openSheet(b.dataset.meal);break;
  case 'del':{const k=UI.foodDate||K;const d=day(k);d.food=d.food.filter(e=>e.id!==b.dataset.id);markDirty(k);render();break}
  case 'copyprev':{const k=UI.foodDate||K;const prev=peekDay(addDays(k,-1)).food;if(!prev.length){toast('Вчера ничего не записано');return}
    const d=day(k);prev.forEach(e=>d.food.push({...e,id:uid()}));markDirty(k);render();toast('Скопировано: '+prev.length+' поз.');break}
  case 'menu':UI.menu=b.dataset.v;saveLocal();render();break;
  case 'addmeal':{const k=UI.foodDate||K;const m=MENUS.find(x=>x.id===UI.menu)||MENUS[0];const ml=m.meals[+b.dataset.i];const d=day(k);
    ml.items.forEach(([id,g])=>d.food.push(entryFrom(foodById(id),g,ml.slot)));markDirty(k);render();toast('Записано: '+ml.name);break}
  case 'addday':{const k=UI.foodDate||K;const m=MENUS.find(x=>x.id===UI.menu)||MENUS[0];const d=day(k);
    m.meals.forEach(ml=>ml.items.forEach(([id,g])=>d.food.push(entryFrom(foodById(id),g,ml.slot))));markDirty(k);render();toast('Весь день «'+m.name+'» записан');break}
  case 'delfood':S.foods=S.foods.filter(f=>f.id!==b.dataset.id);markDirty('profile');render();break;
  case 'saveTargets':{const v=['#sK','#sP','#sF','#sC'].map(numIn);if(v.some(x=>!(x>0))){toast('Заполни все четыре нормы');return}
    Object.assign(S.settings,{kcal:r0(v[0]),p:r0(v[1]),f:r0(v[2]),c:r0(v[3])});markDirty('profile');render();toast('Нормы сохранены');break}
  case 'recalc':{const w=numIn('#sW'),h=numIn('#sH'),ag=numIn('#sA');if(!(w>30&&h>100&&ag>10)){toast('Проверь вес, рост и возраст');return}
    const kcal=Math.round(((10*w+6.25*h-5*ag+5)*1.55+350)/50)*50;const p=Math.max(110,Math.round(w*2/5)*5),f=Math.round(w*1.35/5)*5;const c=Math.round((kcal-p*4-f*9)/4/5)*5;
    Object.assign(S.settings,{kcal,p,f,c,weight:r1(w),height:r0(h),age:r0(ag)});markDirty('profile');render();toast('Новая норма: '+nf(kcal)+' ккал');break}
  /* шторка */
  case 'export':{const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const u=URL.createObjectURL(blob);const l=document.createElement('a');l.href=u;l.download='plan-na-massu-'+K+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast('Копия скачана');break}
  case 'sclose':closeSheet();break;
  case 'smeal':UI.sheet.meal=b.dataset.v;renderSheet();break;
  case 'smode':UI.sheet.mode=b.dataset.v;UI.sheet.sel=null;renderSheet();break;
  case 'spick':{const f=foodById(b.dataset.id);UI.sheet.sel=f.id;UI.sheet.amt=f.per==='pc'?1:(f.pc||100);renderSheet();break}
  case 'sback':UI.sheet.sel=null;renderSheet();break;
  case 'qamt':UI.sheet.amt=b.dataset.v;renderSheet();break;
  case 'sadd':{const f=foodById(UI.sheet.sel);const amt=numIn('#famt');if(!(amt>0)){toast('Укажи количество');return}const k=UI.foodDate||K;day(k).food.push(entryFrom(f,amt,UI.sheet.meal));markDirty(k);closeSheet();render();toast('Добавлено: '+f.n);break}
  case 'cper':UI.sheet.per=b.dataset.v;renderSheet();break;
  case 'csave':{const n=($('#cN').value||'').trim(),kk=numIn('#cK');const err=$('#cErr');
    if(!n||!(kk>=0)){err.textContent=!n?'Напиши название':'Укажи калории';err.hidden=false;return}
    const f={id:'u'+uid(),n,k:r0(kk),p:r1(numIn('#cP')||0),f:r1(numIn('#cF')||0),c:r1(numIn('#cC')||0),mine:true};
    if(UI.sheet.per==='pc'){f.per='pc';f.pcl=($('#cPl')?.value||'порция').trim()||'порция'}
    S.foods.unshift(f);markDirty('profile');UI.sheet.mode='base';UI.sheet.sel=f.id;UI.sheet.amt=f.per==='pc'?1:100;renderSheet();break}
  case 'qsave':{const n=($('#qN').value||'').trim()||'Без названия',kk=numIn('#qK');const err=$('#qErr');if(!(kk>0)){err.textContent='Укажи калории';err.hidden=false;return}
    const k=UI.foodDate||K;day(k).food.push({id:uid(),fid:null,n,g:null,q:1,ql:'порц.',k:r0(kk),p:r1(numIn('#qP')||0),f:r1(numIn('#qF')||0),c:r1(numIn('#qC')||0),meal:UI.sheet.meal});
    markDirty(k);closeSheet();render();toast('Добавлено: '+n);break}
  }
});
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.id==='fq'&&UI.sheet){UI.sheet.q=t.value;const q=t.value.trim().toLowerCase();$('#flist').innerHTML=foodListHtml(allFoods().filter(f=>!q||f.n.toLowerCase().includes(q)).slice(0,60),q)}
  if(t.id==='famt'&&UI.sheet){UI.sheet.amt=t.value;const f=foodById(UI.sheet.sel);const e=entryFrom(f,parseFloat(t.value.replace(',','.'))||0,'x');
    $('#fcalc').innerHTML=`<span class="hero-k num" style="font-size:24px">${e.k}<span class="muted" style="font-size:13px;font-family:var(--body)"> ккал</span></span>${macTxt(e)}`}
  if((t.id==='cK'||t.id==='cN')&&$('#cErr'))$('#cErr').hidden=true;
  if(t.id==='qK'&&$('#qErr'))$('#qErr').hidden=true;
});
document.addEventListener('change',ev=>{
  if(ev.target.id!=='importFile')return;const file=ev.target.files[0];if(!file)return;
  file.text().then(t=>{const o=JSON.parse(t);if(!o||typeof o!=='object'||!o.days||!o.settings)throw 0;
    if(!confirm('Заменить текущие данные копией из файла?'))return;S={...defaults(),...o,settings:{...defaults().settings,...o.settings}};saveLocal();render();toast('Копия загружена')})
   .catch(()=>toast('Это не файл копии из приложения'));ev.target.value='';
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&UI.sheet)closeSheet()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(T)tick();if(UI.tab==='today')render()}});

render();if(T)runTimer();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
window.addEventListener('online',renderSync);window.addEventListener('offline',renderSync);
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
</script>
</body>
</html>
